name: Build Fork Windows Vulkan

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  windows-vulkan:
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.357.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe
          & $env:RUNNER_TEMP\VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}
          Add-Content $env:GITHUB_PATH C:\VulkanSDK\${env:VULKAN_VERSION}\bin

      - name: Install Ninja
        run: |
          choco install ninja

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja Multi-Config `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_BORINGSSL=ON

      - name: Build Release
        run: |
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Stage Artifacts
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Get-ChildItem -Path build/bin/Release -Include *.exe,*.dll -Recurse | Copy-Item -Destination staging -Force
          Get-ChildItem -Path build/bin -Include *.exe,*.dll -Recurse | Copy-Item -Destination staging -Force
          Write-Host Staged binaries:
          Get-ChildItem -Path staging

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-fork-win-vulkan-x64
          path: staging/
          retention-days: 14
